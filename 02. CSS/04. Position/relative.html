<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relative</title>
    <style>
      .relative {
        position: relative;
        top: 50px;
        border: 3px solid green;
      }
    </style>
  </head>
  <body>
    <h2>position: relative;</h2>

    <p>
      Um elemento com a propriedade position: relative; é posicionado em relação
      à sua posição NORMAL.
    </p>

    <div class="relative">Essa div tem o elemento com position: relative</div>
  </body>
</html>
