<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position Fixed</title>
    <style>
      body {
        height: 2000px; /* Para permitir rolagem na página */
      }

      .fixed-box {
        position: fixed; /* Fixa a posição do elemento */
        top: 0; /* Fica no topo da janela */
        right: 0; /* Fica à direita da janela */
        width: 100px; /* Largura da div */
        height: 50px; /* Altura da div */
        background-color: lightpink; /* Cor de fundo */
        text-align: center; /* Centraliza o texto */
        line-height: 50px; /* Centraliza verticalmente o texto */
      }
    </style>
  </head>
  <body>
    <div class="fixed-box">Div com Position Fixed</div>
  </body>
</html>
