<!doctype html>
<html>
  <head>
    <title>Grid: Desafio 03</title>

    <style>
      body {
        background-color: #fff;
        color: #333;
        font-size: 1.2rem;
        font-family: Arial, Helvetica, sans-serif;
        padding: 1rem;
        margin: 0;
      }

      .card {
        display: grid;
        grid-template-rows: 200px min-content;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        align-items: start; /* keep cards aligned to top */
        max-width: 1100px;
        margin: 0 auto;
      }

      .card > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tags {
        margin: 0;
        padding: 0.6rem 0.4rem 0.2rem 0.4rem;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        justify-content: center; /* center tags under each card */
        gap: 10px;
      }

      .tags > li {
        background-color: #999;
        color: #fff;
        padding: 0.35rem 0.9rem;
        border-radius: 0.35rem;
        font-size: 80%;
        margin: 0; /* spacing handled by gap on the ul */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="./images/balloons1.jpg" alt="a single red balloon" />
        <ul class="tags">
          <li>balloon</li>
          <li>red</li>
          <li>sky</li>
          <li>blue</li>
          <li>Hot air balloon</li>
        </ul>
      </div>
      <div class="card">
        <img src="./images/balloons2.jpg" alt="balloons over some houses" />
        <ul class="tags">
          <li>balloons</li>
          <li>houses</li>
          <li>train</li>
          <li>harborside</li>
        </ul>
      </div>
      <div class="card">
        <img
          src="./images/balloons3.jpg"
          alt="close-up of balloons inflating"
        />
        <ul class="tags">
          <li>balloons</li>
          <li>inflating</li>
          <li>green</li>
          <li>blue</li>
        </ul>
      </div>
      <div class="card">
        <img src="./images/balloons4.jpg" alt="a balloon in the sun" />
        <ul class="tags">
          <li>balloon</li>
          <li>sun</li>
          <li>sky</li>
          <li>summer</li>
          <li>bright</li>
        </ul>
      </div>
    </div>
  </body>
</html>
