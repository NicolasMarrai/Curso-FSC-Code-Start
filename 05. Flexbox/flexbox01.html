<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 1 - Estrutura Básica do Flexbox</title>
    <style>
      .container {
        display: flex;
        border: 2px solid #333;
        height: 200px;
      }

      .Item {
        border: 1px solid #666;
        padding: 20px;
        margin: 10px;
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="Item">Item-1</div>
      <div class="Item">Item-2</div>
      <div class="Item">Item-3</div>
    </div>
  </body>
</html>
